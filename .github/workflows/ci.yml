name: ci

# CI 的目标：在**裸环境**（无 Milvus、无模型 Key）里验证核心逻辑没坏。
# 因此用例全部走离线实现：HashingEmbedding + InMemoryStore + 离线抽取模型。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,runtime,multimodal]"

      - name: 静态检查
        run: |
          pip install ruff
          ruff check .

      - name: 编译检查
        run: python -m compileall -q src scripts

      - name: 单元测试
        run: python -m pytest -q

      - name: 离线冒烟（入库 + 问答 + 评测）
        run: |
          python scripts/demo.py
          python scripts/eval.py --memory

      - name: Wiki 层冒烟（编译 + lint + 命中率）
        run: |
          python scripts/build_wiki.py --lint
          python scripts/wiki_stats.py
